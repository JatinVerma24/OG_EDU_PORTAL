version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: docker/prod.Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/ogedu_portal}
      - REDIS_URL=redis://redis:6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - SENTRY_DSN=${SENTRY_DSN}
    depends_on:
      - mongo
      - redis
    restart: always
    networks:
      - ogedu-network

  mongo:
    image: mongo:6.0
    container_name: ogedu_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - ogedu-network

  redis:
    image: redis:7.0-alpine
    container_name: ogedu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always
    networks:
      - ogedu-network

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: ogedu_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: always
    networks:
      - ogedu-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: ogedu_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: always
    networks:
      - ogedu-network

  nginx:
    image: nginx:alpine
    container_name: ogedu_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: always
    networks:
      - ogedu-network

networks:
  ogedu-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
  prometheus-data:
  grafana-data:
